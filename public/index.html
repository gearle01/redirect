        /* Estilo para a tela de carregamento */
        .loading-screen {

            align-items: center;

            background-color: #6b53a2; /* Cor de fundo */
            color: white; /* Texto em branco para melhor contraste */
            font-size: 24px;
            font-weight: bold;
            text-align: center; /* Centralizar texto em telas menores */
            padding: 20px; /* Adiciona padding para melhorar a responsividade */

        .loading-logo {

            width: 100%; /* Ajusta o tamanho da imagem conforme o contêiner */
            margin-bottom: 20px; /* Espaço entre a imagem e o texto */
